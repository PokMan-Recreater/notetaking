<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
        }

        .note-word-count {
            font-size: 11px;
            font-weight: 600;
            color: #667eea;
            background: rgba(102, 126, 234, 0.12);
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-translate {
            background: #17a2b8;
            color: white;
        }

        .btn-translate:hover {
            background: #138496;
            transform: translateY(-1px);
        }

        .btn-translate:disabled {
            background: #8bb8bf;
            cursor: not-allowed;
            transform: none;
            pointer-events: none;
        }

        .translate-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .translate-radio {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border: 2px solid #17a2b8;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #0c5460;
            background: #fff;
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
        }

        .translate-radio input {
            accent-color: #17a2b8;
            margin: 0;
            cursor: pointer;
        }

        .translate-radio:hover {
            background: #eef7f9;
        }

        .translate-radio input:checked + span {
            color: #0c5460;
            font-weight: 700;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .translation-panel {
            background: #eef7f9;
            border: 2px solid #17a2b8;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .translation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .translation-header h3 {
            font-size: 1rem;
            color: #0c5460;
        }

        .translation-actions {
            display: flex;
            gap: 8px;
        }

        .translation-output {
            background: #fff;
            border: 1px solid #d1e7ec;
            border-radius: 8px;
            padding: 12px 15px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            min-height: 40px;
            max-height: 300px;
            overflow-y: auto;
            color: #333;
        }

        .btn-apply {
            background: #28a745;
            color: white;
        }

        .btn-apply:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-dismiss {
            background: #6c757d;
            color: white;
        }

        .btn-dismiss:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #5a6fd8;
        }

        /* ===== Dark mode ===== */
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 14px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dark-mode-toggle:hover {
            background: rgba(0, 0, 0, 0.45);
            transform: translateY(-1px);
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
        }

        body.dark-mode .sidebar,
        body.dark-mode .note-editor {
            background: rgba(30, 30, 46, 0.95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        body.dark-mode .header {
            color: #ffffff;
        }

        body.dark-mode .search-box {
            background: #232338;
            border-color: #3a3a55;
            color: #e0e0e0;
        }

        body.dark-mode .search-box::placeholder {
            color: #8a8aa0;
        }

        body.dark-mode .search-box:focus {
            border-color: #7c8cf8;
        }

        body.dark-mode .note-item {
            background: #26263d;
        }

        body.dark-mode .note-item:hover {
            background: #2e2e48;
        }

        body.dark-mode .note-item.active {
            background: #33335a;
            border-color: #7c8cf8;
        }

        body.dark-mode .note-title {
            color: #f0f0f0;
        }

        body.dark-mode .note-preview {
            color: #b0b0c0;
        }

        body.dark-mode .note-date {
            color: #8a8aa0;
        }

        body.dark-mode .note-word-count {
            color: #9aa4ff;
            background: rgba(124, 140, 248, 0.2);
        }

        body.dark-mode .form-input,
        body.dark-mode .form-textarea {
            background: #232338;
            border-color: #3a3a55;
            color: #e0e0e0;
        }

        body.dark-mode .form-input::placeholder,
        body.dark-mode .form-textarea::placeholder {
            color: #8a8aa0;
        }

        body.dark-mode .form-label {
            color: #b0b0c0;
        }

        body.dark-mode .editor-title {
            color: #f0f0f0;
        }

        body.dark-mode .translation-panel {
            background: #232338;
            border-color: #3a6a7a;
        }

        body.dark-mode .translation-header h3 {
            color: #9fd8e2;
        }

        body.dark-mode .translation-output {
            background: #1a1a2e;
            border-color: #3a3a55;
            color: #e0e0e0;
        }

        body.dark-mode .translate-radio {
            background: #26263d;
            border-color: #3a6a7a;
            color: #9fd8e2;
        }

        body.dark-mode .translate-radio:hover {
            background: #2e2e48;
        }

        body.dark-mode .empty-state {
            color: #b0b0c0;
        }

        body.dark-mode .success {
            background: #12351f;
            color: #8ce6a8;
        }

        body.dark-mode .error {
            background: #3a1a1a;
            color: #f0a0a0;
        }

        body.dark-mode .loading {
            color: #9aa4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="dark-mode-toggle" id="darkModeToggle">🌙 Dark Mode</button>
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <div class="translate-group">
                            <label class="translate-radio"><input type="radio" name="translateTarget" value="zh-TW" checked><span>繁體中文</span></label>
                            <label class="translate-radio"><input type="radio" name="translateTarget" value="zh-CN"><span>简体中文</span></label>
                            <label class="translate-radio"><input type="radio" name="translateTarget" value="ko"><span>한국어</span></label>
                            <label class="translate-radio"><input type="radio" name="translateTarget" value="ja"><span>日本語</span></label>
                            <button class="btn btn-translate" id="translateBtn">🌐 翻譯</button>
                        </div>
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title..." maxlength="50">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>
                </div>

                <div class="translation-panel" id="translationPanel" style="display: none;">
                    <div class="translation-header">
                        <h3 id="translationHeaderLabel">🌐 翻譯</h3>
                        <div class="translation-actions">
                            <button class="btn btn-apply" id="applyTranslationBtn">套用</button>
                            <button class="btn btn-dismiss" id="dismissTranslationBtn">關閉</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">標題</label>
                        <div class="translation-output" id="translationTitle"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">內容</label>
                        <div class="translation-output" id="translationContent"></div>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.translatedTitle = '';
                this.translatedContent = '';
                this.translationLabels = {
                    'zh-TW': '中文翻譯 (繁體)',
                    'zh-CN': '中文翻译 (简体)',
                    'ko': '한국어 번역',
                    'ja': '日本語翻訳'
                };
                this.init();
            }

            async init() {
                this.bindEvents();
                this.initDarkMode();
                await this.loadNotes();
            }

            initDarkMode() {
                const stored = localStorage.getItem('notetaking-dark-mode');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                this.isDarkMode = stored !== null ? stored === 'true' : prefersDark;
                this.applyDarkMode();
            }

            applyDarkMode() {
                document.body.classList.toggle('dark-mode', this.isDarkMode);
                const btn = document.getElementById('darkModeToggle');
                if (btn) btn.textContent = this.isDarkMode ? '☀️ Light Mode' : '🌙 Dark Mode';
            }

            toggleDarkMode() {
                this.isDarkMode = !this.isDarkMode;
                localStorage.setItem('notetaking-dark-mode', String(this.isDarkMode));
                this.applyDarkMode();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('applyTranslationBtn').addEventListener('click', () => this.applyTranslation());
                document.getElementById('dismissTranslationBtn').addEventListener('click', () => this.hideTranslation());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                document.getElementById('darkModeToggle').addEventListener('click', () => this.toggleDarkMode());
                
                // Auto-save on content change (debounced). Saves both new and
                // existing notes once there is any content, so work is never lost.
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        const title = document.getElementById('noteTitle').value.trim();
                        const content = document.getElementById('noteContent').value.trim();
                        if (this.currentNote && (title || content)) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                notesList.innerHTML = this.notes.map(note => {
                    const words = this.countWords(note);
                    const wordBadge = words > 0 ? `<div class="note-word-count">${words} ${words === 1 ? 'word' : 'words'}</div>` : '';
                    return `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(this.truncate(note.title || 'Untitled', 30))}</div>
                        <div class="note-preview">${this.escapeHtml(this.truncate(note.content || 'No content', 16))}</div>
                        <div class="note-meta">
                            <div class="note-date">${this.formatDate(note.updated_at)}</div>
                            ${wordBadge}
                        </div>
                    </div>
                `;
                }).join('');
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                this.hideTranslation();
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
            }

            createNewNote() {
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                this.hideTranslation();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.hideTranslation();
                this.currentNote = null;
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            async translateNote() {
                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    this.showMessage('Please enter a title or content to translate', 'error');
                    return;
                }

                // Read the selected target language from the radio buttons.
                const checked = document.querySelector('input[name="translateTarget"]:checked');
                const target = checked ? checked.value : 'zh-TW';

                const btn = document.getElementById('translateBtn');
                const originalLabel = btn.textContent;
                btn.disabled = true;
                btn.textContent = '翻譯中...';
                this.hideMessage();

                try {
                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content, target })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Translation failed');

                    this.showTranslation(data.title || '', data.content || '', target);
                } catch (error) {
                    this.showMessage(`Error translating note: ${error.message}`, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = originalLabel;
                }
            }

            showTranslation(title, content, target) {
                this.translatedTitle = title;
                this.translatedContent = content;
                document.getElementById('translationTitle').textContent = title || '(無標題)';
                document.getElementById('translationContent').textContent = content || '(無內容)';

                const label = this.translationLabels[target] || '翻譯';
                document.getElementById('translationHeaderLabel').textContent = `🌐 ${label}`;

                const panel = document.getElementById('translationPanel');
                panel.style.display = 'block';
                panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            hideTranslation() {
                const panel = document.getElementById('translationPanel');
                if (panel) panel.style.display = 'none';
                this.translatedTitle = '';
                this.translatedContent = '';
            }

            applyTranslation() {
                if (!this.translatedTitle && !this.translatedContent) return;

                document.getElementById('noteTitle').value = this.translatedTitle || '';
                document.getElementById('noteContent').value = this.translatedContent || '';
                document.getElementById('editorTitle').textContent = this.translatedTitle || 'Untitled Note';
                this.hideTranslation();
                this.saveNote(false);
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => {
                    const words = this.countWords(note);
                    const wordBadge = words > 0 ? `<div class="note-word-count">${words} ${words === 1 ? 'word' : 'words'}</div>` : '';
                    return `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(this.truncate(note.title || 'Untitled', 30))}</div>
                        <div class="note-preview">${this.escapeHtml(this.truncate(note.content || 'No content', 16))}</div>
                        <div class="note-meta">
                            <div class="note-date">${this.formatDate(note.updated_at)}</div>
                            ${wordBadge}
                        </div>
                    </div>
                `;
                }).join('');
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            truncate(text, maxLength) {
                if (!text) return text;
                text = String(text);
                if (text.length <= maxLength) return text;
                return text.slice(0, maxLength).replace(/\s+\S*$/, '') + '…';
            }

            countWords(note) {
                const title = (note.title || '').trim();
                const content = (note.content || '').trim();
                const combined = `${title} ${content}`.trim();
                if (!combined) return 0;
                return combined.split(/\s+/).length;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
